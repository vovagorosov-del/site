<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План учебного проекта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb;--surface:#ffffff;--ink:#1c2557;--muted:#56608c;--line:#c5d0ea;--accent:#ffb020;--accent-ink:#1c2557;--focus:#3b5bdb;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111633;--surface:#1b2250;--ink:#e9edff;--muted:#a4aed8;--line:#2f3a78;--focus:#8ea2ff}
}
:root[data-theme="dark"]{--bg:#111633;--surface:#1b2250;--ink:#e9edff;--muted:#a4aed8;--line:#2f3a78;--focus:#8ea2ff}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:36px 20px 56px}
h1{font-family:Unbounded,Onest,system-ui,sans-serif;font-weight:600;font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.15;margin:0 0 10px}
h2{font-size:1.05rem;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 24px;max-width:52ch}
.steps{display:flex;gap:6px;list-style:none;margin:0 0 24px;padding:0;border-bottom:2px solid var(--line);overflow-x:auto}
.steps li{color:var(--muted);padding:8px 12px;margin-bottom:-2px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.steps li.done{color:var(--ink)}
.steps li[aria-current]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--accent);padding:20px 22px;margin-bottom:22px}
.lbl{display:block;font-weight:600;margin:0 0 4px}
.f{margin-top:18px}.f:first-child{margin-top:0}
.hint{color:var(--muted);font-size:.93rem;margin:0 0 8px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{border-color:var(--focus);outline:none}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row input{font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 20px;cursor:pointer;border:2px solid var(--ink);color:var(--ink);background:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{padding:8px 12px;font-size:.9rem;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
:is(.btn,input,textarea):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.meta{min-height:1.5em;color:var(--muted);font-size:.95rem;margin:12px 2px 0}
.pre{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
@media print{
  body{background:#fff;color:#000}
  h1,.lead,.steps,.actions,.meta,.hint{display:none}
  .card{border:0;box-shadow:none;padding:0;background:#fff;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>План учебного проекта</h1>
  <p class="lead">Ответь на вопросы о своём проекте, а в конце получишь готовый файл с планом.</p>
  <ol class="steps" id="steps"></ol>
  <section id="view"></section>
</main>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var STEPS = ['Идея','Вопросы','Этапы','План'];
  var KEY = 'plan_v1';
  var Q = [
    'Зачем этот проект? Какую проблему он решает или что хочет показать?',
    'Для кого он? Кто будет им пользоваться или кому он будет интересен?',
    'Что будет готовым результатом, который можно показать?',
    'Что тебе нужно изучить или чем пользоваться, чтобы это сделать?',
    'Как ты поймёшь, что получилось хорошо?',
    'Что может пойти не так и что ты будешь делать в этом случае?',
    'Сколько у тебя времени и сколько часов в неделю ты готов на это тратить?'
  ];
  var ST = ['Изучение темы','Подготовка','Первая версия','Проверка и доработка','Оформление и защита'];
  function fresh(){
    return {step:0, title:'', subject:'', idea:'', a:Q.map(function(){return ''}), st:ST.map(function(t){return {t:t,d:''}})};
  }
  var S = fresh();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){ var o = JSON.parse(raw); if (o && o.a && o.st) S = o; }
  } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function esc(s){ return String(s).replace(/[&<>\"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function len(t){ return (t || '').trim().length; }

  function missing(){
    var n = 0;
    if (S.step === 0){ if (len(S.title) < 3) n++; if (len(S.idea) < 30) n++; }
    else if (S.step === 1) S.a.forEach(function(x){ if (len(x) < 15) n++; });
    else if (S.step === 2) S.st.forEach(function(x){ if (len(x.t) < 2) n++; if (len(x.d) < 20) n++; });
    return n;
  }
  function gate(){
    var n = missing();
    var b = document.querySelector('[data-act="next"]'); if (b) b.disabled = n > 0;
    var g = $('#gm'); if (g) g.textContent = n ? 'Осталось заполнить полей: ' + n + '. Пиши развёрнуто и своими словами.' : '';
  }

  function ta(k, v, rows){ return '<textarea data-k="' + k + '" rows="' + rows + '">' + esc(v || '') + '</textarea>'; }
  function nav(nextText){
    return '<div class="actions">' + (S.step > 0 ? '<button class="btn" data-act="back">Назад</button>' : '') +
      '<button class="btn primary" data-act="next">' + nextText + '</button></div><p class="meta" id="gm"></p>';
  }
  function view0(){
    return '<div class="card"><div class="f"><label class="lbl" for="ti">Название проекта</label><input id="ti" data-k="title" value="' + esc(S.title) + '"></div>' +
      '<div class="f"><label class="lbl" for="su">Предмет или направление (по желанию)</label><input id="su" data-k="subject" value="' + esc(S.subject) + '"></div>' +
      '<div class="f"><label class="lbl" for="id">Опиши идею своими словами</label><p class="hint">2-4 предложения: что хочешь сделать и зачем. Минимум 30 символов.</p>' +
      ta('idea', S.idea, 5).replace('<textarea ', '<textarea id="id" ') + '</div></div>' + nav('Дальше: вопросы');
  }
  function view1(){
    var h = '<div class="card"><p class="hint">Отвечай своими словами, минимум 15 символов на вопрос. Правильных ответов здесь нет, важно, что думаешь ты.</p>';
    Q.forEach(function(q,i){ h += '<div class="f"><span class="lbl">' + esc(q) + '</span>' + ta('a' + i, S.a[i], 3) + '</div>'; });
    return h + '</div>' + nav('Дальше: этапы');
  }
  function view2(){
    var h = '<div class="card"><p class="hint">Разбей проект на этапы. Названия можно менять, этапы можно добавлять и убирать. Для каждого напиши, что и к ка��ому сроку сделаешь.</p>';
    S.st.forEach(function(x,i){
      h += '<div class="f"><div class="row"><input data-k="t' + i + '" value="' + esc(x.t) + '" aria-label="Название этапа">' +
        (S.st.length > 2 ? '<button class="btn small" data-act="rm" data-i="' + i + '">Убрать</button>' : '') + '</div>' + ta('d' + i, x.d, 3) + '</div>';
    });
    return h + '<div class="f"><button class="btn small" data-act="add">Добавить этап</button></div></div>' + nav('Собрать план');
  }
  function buildDoc(){
    var L = ['ПЛАН ПРОЕКТА', 'Название: ' + S.title];
    if (S.subject) L.push('Предмет: ' + S.subject);
    L.push('Дата: ' + new Date().toLocaleDateString('ru-RU'), '', 'ИДЕЯ', S.idea, '', 'ВОПРОСЫ О ПРОЕКТЕ');
    Q.forEach(function(q,i){ L.push('', q, S.a[i]); });
    L.push('', 'ЭТАПЫ');
    S.st.forEach(function(x,i){ L.push('', (i + 1) + '. ' + x.t, x.d); });
    return L.join('\n');
  }
  function view3(){
    return '<div class="card"><h2>Твой план готов</h2><p class="hint">Скачай файл или распечатай страницу, чтобы сохранить её как PDF.</p><p class="pre">' + esc(buildDoc()) + '</p></div>' +
      '<div class="actions"><button class="btn" data-act="back">Назад</button><button class="btn primary" data-act="dl">Скачать файл</button>' +
      '<button class="btn" data-act="print">Печать / PDF</button><button class="btn" data-act="copy">Копировать</button><button class="btn" data-act="reset">Начать заново</button></div><p class="meta" id="gm"></p>';
  }
  function render(){
    $('#steps').innerHTML = STEPS.map(function(n,i){
      return '<li' + (i === S.step ? ' aria-current="step"' : '') + (i < S.step ? ' class="done"' : '') + '>' + (i + 1) + '. ' + n + '</li>';
    }).join('');
    $('#view').innerHTML = [view0, view1, view2, view3][S.step]();
    gate();
  }
  function msg(m){ var g = $('#gm'); if (g) g.textContent = m; }
  function dl(){
    var b = new Blob(['\uFEFF' + buildDoc()], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a'), u = URL.createObjectURL(b);
    a.href = u; a.download = 'plan-proekta.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
    msg('Файл plan-proekta.txt скачан');
  }
  function copy(){
    var text = buildDoc();
    var fb = function(){
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); msg('Скопировано'); } catch (e) { msg('Не удалось скопировать, выдели текст вручную'); }
      document.body.removeChild(t);
    };
    try { navigator.clipboard.writeText(text).then(function(){ msg('Скопировано'); }, fb); } catch (e) { fb(); }
  }
  function go(n){ S.step = n; save(); window.scrollTo(0, 0); render(); }
  function setV(k, v){
    var i = +k.slice(1);
    if (/^a\d+$/.test(k)) S.a[i] = v;
    else if (/^t\d+$/.test(k)) S.st[i].t = v;
    else if (/^d\d+$/.test(k)) S.st[i].d = v;
    else S[k] = v;
  }

  $('#view').addEventListener('input', function(e){
    var k = e.target.getAttribute('data-k'); if (!k) return;
    setV(k, e.target.value); save(); gate();
  });
  $('#view').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act');
    if (a === 'next') go(S.step + 1);
    else if (a === 'back') go(S.step - 1);
    else if (a === 'add'){ S.st.push({t:'',d:''}); save(); render(); }
    else if (a === 'rm'){ S.st.splice(+b.getAttribute('data-i'), 1); save(); render(); }
    else if (a === 'dl') dl();
    else if (a === 'print') window.print();
    else if (a === 'copy') copy();
    else if (a === 'reset'){ S = fresh(); try { localStorage.removeItem(KEY); } catch (x) {} window.scrollTo(0, 0); render(); }
  });

  render();
})();
</script>
</body>
</html>
